{% extends 'base.html' %}
{% block title %}{{ submit_label }} · 商品 · ShoppingMgr{% endblock %}
{% block content %}
<nav aria-label="面包屑" class="mb-2">
  <ol class="breadcrumb mb-0 small">
    <li class="breadcrumb-item"><a href="{{ url_for('products.list') }}">商品</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ submit_label }}</li>
  </ol>
</nav>
<h1 class="h4 mb-3">{{ submit_label }}</h1>

<form method="post" action="{{ action_url }}" class="card shadow-sm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label" for="name">名称 <span class="text-danger">*</span></label>
        <input class="form-control" type="text" id="name" name="name" maxlength="80" required value="{{ obj.name if obj else '' }}">
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="category_id">品类</label>
        <select class="form-select" id="category_id" name="category_id">
          <option value="">未归类</option>
          {% for c in categories %}
          <option value="{{ c.id }}"{% if obj and obj.category_id is not none and obj.category_id == c.id %} selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label" for="unit">单位</label>
        <input class="form-control" type="text" id="unit" name="unit" maxlength="10" value="{{ obj.unit if obj and obj.unit else '件' }}">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label" for="price">单价（元）</label>
        <input class="form-control text-end money" type="number" step="0.01" min="0" id="price" name="price" value="{{ '%.2f'|format(obj.price) if obj and obj.price is not none else '' }}">
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="barcode">条码</label>
        <input class="form-control" type="text" id="barcode" name="barcode" maxlength="64" value="{{ obj.barcode if obj and obj.barcode else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label" for="note">备注</label>
        <input class="form-control" type="text" id="note" name="note" maxlength="200" value="{{ obj.note if obj and obj.note else '' }}">
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1"{% if obj is none or obj.is_active %} checked{% endif %}>
          <label class="form-check-label" for="is_active">在售（纳入选购范围）</label>
        </div>
      </div>
    </div>
  </div>
  <div class="card-footer d-flex gap-2">
    <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('products.list') }}">取消</a>
  </div>
</form>
{% endblock %}
