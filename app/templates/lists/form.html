{% extends 'base.html' %}
{% block title %}{{ submit_label }} · 购物清单 · ShoppingMgr{% endblock %}
{% block content %}
<nav aria-label="面包屑" class="mb-2">
  <ol class="breadcrumb mb-0 small">
    <li class="breadcrumb-item"><a href="{{ url_for('lists.list') }}">购物清单</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ submit_label }}</li>
  </ol>
</nav>
<h1 class="h4 mb-3">{{ submit_label }}</h1>

<form method="post" action="{{ action_url }}" class="card shadow-sm">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="name">清单名称 <span class="text-danger">*</span></label>
      <input class="form-control" type="text" id="name" name="name" maxlength="80" required value="{{ obj.name if obj else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="note">备注</label>
      <input class="form-control" type="text" id="note" name="note" maxlength="200" value="{{ obj.note if obj and obj.note else '' }}">
    </div>
  </div>
  <div class="card-footer d-flex gap-2">
    <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
    {% if obj %}
    <a class="btn btn-outline-secondary" href="{{ url_for('lists.detail', lid=obj.id) }}">取消</a>
    {% else %}
    <a class="btn btn-outline-secondary" href="{{ url_for('lists.list') }}">取消</a>
    {% endif %}
  </div>
</form>
{% endblock %}
