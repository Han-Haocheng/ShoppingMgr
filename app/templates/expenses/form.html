{% extends 'base.html' %}
{% block title %}{{ submit_label }} · 消费记录 · ShoppingMgr{% endblock %}
{% block content %}
<nav aria-label="面包屑" class="mb-2">
  <ol class="breadcrumb mb-0 small">
    <li class="breadcrumb-item"><a href="{{ url_for('expenses.list') }}">消费记录</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ submit_label }}</li>
  </ol>
</nav>
<h1 class="h4 mb-3">{{ submit_label }}</h1>

<form method="post" action="{{ action_url }}" class="card shadow-sm">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-12 col-md-4">
        <label class="form-label" for="spent_on">日期 <span class="text-danger">*</span></label>
        <input class="form-control" type="date" id="spent_on" name="spent_on" required value="{{ obj.spent_on.isoformat() if obj and obj.spent_on else '' }}">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label" for="amount">金额（元） <span class="text-danger">*</span></label>
        <input class="form-control text-end money" type="number" step="0.01" min="0" id="amount" name="amount" required value="{{ '%.2f'|format(obj.amount) if obj and obj.amount is not none else '' }}">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label" for="category_id">品类</label>
        <select class="form-select" id="category_id" name="category_id">
          <option value="">未归类</option>
          {% for c in categories %}
          <option value="{{ c.id }}"{% if obj and obj.category_id is not none and obj.category_id == c.id %} selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="product_id">商品</label>
        <select class="form-select" id="product_id" name="product_id">
          <option value="">不关联</option>
          {% for p in products %}
          <option value="{{ p.id }}"{% if obj and obj.product_id is not none and obj.product_id == p.id %} selected{% endif %}>{{ p.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="note">备注</label>
        <input class="form-control" type="text" id="note" name="note" maxlength="200" value="{{ obj.note if obj and obj.note else '' }}">
      </div>
    </div>
  </div>
  <div class="card-footer d-flex gap-2">
    <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('expenses.list') }}">取消</a>
  </div>
</form>
{% endblock %}
