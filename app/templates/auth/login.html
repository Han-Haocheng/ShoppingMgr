{% extends 'base.html' %}
{% block title %}登录 · ShoppingMgr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h5 mb-3">登录</h1>
        <form method="post" action="{{ url_for('auth.login') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          <div class="mb-3">
            <label class="form-label" for="username">用户名</label>
            <input class="form-control" id="username" name="username" type="text"
                   value="{{ request.form.get('username', '') }}"
                   autocomplete="username" maxlength="60" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">密码</label>
            <input class="form-control" id="password" name="password" type="password"
                   autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>
        <p class="text-muted small mt-3 mb-0">还没有账号？<a href="{{ url_for('auth.register') }}">注册</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
