name: 任务
description: 拆出一个可独立交付、可验收的实现任务（内部协作用）
title: "[Task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        任务 issue 是派工与验收的凭据：没有它不开 PR。

        请把「目标」写成可判定的结果，把「验收标准」写成可执行的检查项，把「涉及文件域」写到文件/目录一级。
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 一句话说明要达成的结果，避免只写技术手段
      placeholder: 例：清单详情页显示合计金额并支持勾选条目
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 逐条写成可验证的语句，最好附命令与期望输出
      placeholder: |
        - [ ] GET /lists/<id> 返回 200 且页面含「合计」
        - [ ] .venv/bin/python -m pytest -q 全绿
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 涉及文件域
      description: 列出预期改动的文件或目录，用于并发派工时判重用
      placeholder: |
        - app/templates/lists/detail.html
        - app/blueprints/lists.py
    validations:
      required: true
  - type: dropdown
    id: hours
    attributes:
      label: 预估工时
      options:
        - 0.5 小时内（小改）
        - 0.5–2 小时
        - 2–4 小时
        - 半天
        - 1 天以上（建议再拆）
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: 依赖与阻塞
      description: 可选；依赖的 issue 号或外部条件
      placeholder: 例：依赖 #12 先合入
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 派工前确认
      options:
        - label: 目标与验收标准已写清，第三人可直接执行
          required: true
        - label: 涉及文件域与其他在跑任务不重叠
          required: true
        - label: 若需改动契约，已在目标里写明先改 SPEC.md
          required: true
