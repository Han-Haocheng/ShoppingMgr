name: 功能建议
description: 提出新功能、改进或使用体验上的建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看 README 的非目标说明：本期不做登录鉴权、多用户、CSRF、前端框架、图表看板、JSON API、国际化。
        与现有设计冲突的建议，请说明取舍理由。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前的不便或缺失场景，不要直接跳到实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你希望怎么改；界面、路由或数据结构若有变化请写明
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选；说明为什么不选它们
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 仅模板 / 样式（app/templates、app/static）
        - 路由与后端逻辑（app/blueprints）
        - 数据模型与迁移（app/models.py）
        - 规格契约（SPEC.md）
        - 工程脚手架（.github、CONTRIBUTING.md、README.md）
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 高（阻塞当前使用）
        - 中（明显提升效率）
        - 低（锦上添花）
      default: 1
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已确认 README 与 SPEC.md 中不存在该能力
          required: true
        - label: 已搜索现有 issue 与文档，没有重复建议
          required: true
